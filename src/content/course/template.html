<title>Angel Investing Foundations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a brand-green course band over a calm reading surface; lessons read in one 66ch column with a sticky contents rail on wide screens. */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --ink:#15302a; --muted:#52665f; --line:#d6dfda;
  --band:#1a3c35; --band-ink:#fbe45b; --band-soft:#cfe0d9; --accent:#fbe45b; --accent-ink:#1a3c35;
  --good:#1d7a4c; --good-bg:#e5f3ea; --bad:#971914; --bad-bg:#f8e7e5; --plum:#5c3d68; --chip:#eef2ef;
  --font-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1d19; --surface:#132a25; --ink:#e7efea; --muted:#a3b6af; --line:#274540;
  --band:#1a3c35; --band-ink:#fbe45b; --band-soft:#b9cfc7; --accent:#fbe45b; --accent-ink:#13302a;
  --good:#7fd6a3; --good-bg:#16392b; --bad:#ff9b8f; --bad-bg:#3a1c1a; --plum:#d3b1e2; --chip:#1b3631; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1d19; --surface:#132a25; --ink:#e7efea; --muted:#a3b6af; --line:#274540;
  --band:#1a3c35; --band-ink:#fbe45b; --band-soft:#b9cfc7; --accent:#fbe45b; --accent-ink:#13302a;
  --good:#7fd6a3; --good-bg:#16392b; --bad:#ff9b8f; --bad-bg:#3a1c1a; --plum:#d3b1e2; --chip:#1b3631; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:block;width:170px;aspect-ratio:640/77;max-width:100%;background:currentColor;-webkit-mask:url(__LOGO__) center/contain no-repeat;mask:url(__LOGO__) center/contain no-repeat}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0}

/* hero */
.hero{background:var(--band);color:var(--band-soft);margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 1.5rem);padding-bottom:2.5rem;border-bottom:6px solid var(--accent)}
.hero .logo{color:var(--band-ink)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:2rem;align-items:end;margin-top:2.6rem}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.6rem);line-height:1.02;letter-spacing:-.02em;color:var(--band-ink);font-weight:700;margin-top:.5rem}
.hero .lede{font-family:var(--font-read);font-size:1.15rem;line-height:1.55;max-width:46ch;margin:1rem 0 0;color:var(--band-soft)}
.meter{background:rgba(0,0,0,.18);border:1px solid rgba(251,228,91,.35);border-radius:var(--r);padding:1.1rem 1.2rem;display:grid;gap:.7rem}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;color:var(--band-soft)}
.meter-top strong{font-size:2rem;color:var(--band-ink);font-variant-numeric:tabular-nums;line-height:1}
.ticks{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ticks span{height:8px;border-radius:2px;background:rgba(255,255,255,.18)}
.ticks span.on{background:var(--band-ink)}
.ticks span.half{background:linear-gradient(90deg,var(--band-ink) 50%,rgba(255,255,255,.18) 50%)}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.7rem 1.2rem;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(.95)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}

/* lesson list */
main{padding-block:2.2rem 3rem}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.section-head h2{font-size:1.35rem}
.section-head p{margin:0;color:var(--muted);font-size:.95rem}
.lessons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lesson-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.15rem;cursor:pointer;transition:border-color .15s,transform .15s}
.lesson-card:hover{border-color:var(--ink)}
.num{font-size:1.9rem;font-weight:700;line-height:1;color:var(--plum);font-variant-numeric:tabular-nums;min-width:2ch}
.lesson-card .ct{display:block;font-size:1.08rem;line-height:1.3;font-weight:700}
.lesson-card .sub{display:block;margin:.3rem 0 .7rem;color:var(--muted);font-family:var(--font-read);font-size:.98rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:999px;background:var(--chip);font-weight:600;font-size:.78rem;color:var(--muted)}
.chip.done{background:var(--good-bg);color:var(--good)}
.chip.prog{background:var(--accent);color:var(--accent-ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.finish{margin-top:1.6rem;border:2px solid var(--accent);border-radius:var(--r);padding:1.3rem 1.4rem;background:var(--surface);display:grid;gap:.6rem}
.finish h2{font-size:1.3rem}
.finish p{margin:0;font-family:var(--font-read);color:var(--muted)}

/* footer */
footer{border-top:1px solid var(--line);padding-block:1.6rem 2.4rem;color:var(--muted);font-size:.85rem}
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.5rem;align-items:start}
.foot .logo{color:var(--ink);width:140px}
.foot p{margin:.6rem 0 0;max-width:70ch}
.foot-links{display:grid;gap:.4rem;justify-items:end}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.who{font-size:.88rem;color:var(--band-soft)}
.who a{color:var(--band-ink);font-weight:600}
#syncNote{display:block;font-size:.85rem;margin-top:.2rem}
@media (max-width:860px){.foot-links{justify-items:start}}

/* lesson view */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-soft)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.65rem}
.back{background:none;border:0;color:var(--band-ink);font-weight:600;cursor:pointer;padding:.3rem 0;display:inline-flex;gap:.4rem;align-items:center}
.topbar .logo{width:120px;color:var(--band-ink)}
.readbar{height:4px;background:rgba(255,255,255,.12)}
.readbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.lesson-head{padding-block:2rem 1rem}
.lesson-head .eyebrow{color:var(--plum)}
.lesson-head h1{font-size:clamp(1.8rem,4.2vw,2.7rem);line-height:1.08;letter-spacing:-.015em;margin-top:.5rem;max-width:22ch}
.lesson-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:3rem;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);font-size:.86rem;max-height:calc(100vh - 6rem);overflow:auto;padding-bottom:1rem}
.toc .eyebrow{color:var(--muted);display:block;margin-bottom:.6rem}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:.15rem;border-left:2px solid var(--line)}
.toc button{background:none;border:0;text-align:left;cursor:pointer;padding:.3rem .7rem;color:var(--muted);line-height:1.3;margin-left:-2px;border-left:2px solid transparent;width:100%}
.toc button:hover,.toc button.active{color:var(--ink);border-left-color:var(--accent)}
.toc .lvl2{padding-left:1.4rem;font-size:.82rem}
.toc .quizlink{font-weight:700;color:var(--plum)}
.prose{font-family:var(--font-read);font-size:1.1rem;line-height:1.65;max-width:66ch;min-width:0}
.prose p{margin:0 0 1em}
.prose h2,.prose h3,.prose h4{font-family:var(--font-ui);scroll-margin-top:5rem}
.prose .h1{font-size:1.5rem;margin:2.2rem 0 .7rem;padding-bottom:.35rem;border-bottom:3px solid var(--accent);display:inline-block}
.prose .h2{font-size:1.2rem;margin:1.8rem 0 .5rem}
.prose .h3{font-size:1.02rem;margin:1.3rem 0 .35rem;color:var(--plum)}
.prose ul,.prose ol{margin:0 0 1.1em;padding-left:1.3em}
.prose li{margin:.3em 0}
.prose li::marker{color:var(--plum)}
.prose strong{font-weight:600}
.prose a{color:var(--plum);text-underline-offset:3px}
.table-wrap{overflow-x:auto;margin:0 0 1.4em;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.table-wrap table{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:.92rem;line-height:1.45;min-width:520px}
.table-wrap th{background:var(--band);color:var(--band-ink);text-align:left;padding:.65rem .8rem;font-weight:600}
.table-wrap td{padding:.6rem .8rem;border-top:1px solid var(--line);vertical-align:top}
.table-wrap tr td:first-child{font-weight:600}
.notes{font-family:var(--font-ui);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:0 0 1.6em;overflow:hidden}
.notes-head{background:var(--band);color:var(--band-ink);padding:.75rem 1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:baseline}
.notes-head span{color:var(--band-soft);font-size:.82rem}
.note-row{display:grid;gap:.35rem;padding:.9rem 1rem;border-top:1px solid var(--line)}
.note-row:first-of-type{border-top:0}
.note-row label{font-weight:600;font-size:.95rem}
.note-row .prompt{color:var(--muted);font-size:.9rem}
.note-row textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:.55rem .65rem;font:inherit;font-size:.95rem;background:var(--bg);color:var(--ink)}

/* quiz */
.quiz{margin-top:2.8rem;padding-top:2rem;border-top:1px solid var(--line);font-family:var(--font-ui);max-width:66ch;scroll-margin-top:5rem}
.quiz-head .eyebrow{color:var(--plum)}
.quiz-head h2{font-size:1.6rem;margin:.35rem 0 .3rem}
.quiz-head p{margin:0 0 1.2rem;color:var(--muted)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.15rem;margin-bottom:12px}
.qcard h3{font-size:1.04rem;line-height:1.4;display:flex;gap:.6rem}
.qcard h3 b{color:var(--plum);font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px;margin-top:.9rem}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:.6rem .75rem;cursor:pointer;line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;border:1.5px solid var(--line);font-weight:700;font-size:.85rem}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt .mark{font-size:.78rem;font-weight:700}
.opt.right .mark{color:var(--good)}
.opt.wrong .mark{color:var(--bad)}
.feedback{margin-top:.8rem;font-size:.95rem;padding:.7rem .85rem;border-radius:8px;background:var(--chip)}
.feedback strong{display:block;margin-bottom:.15rem}
.feedback.ok strong{color:var(--good)}
.feedback.no strong{color:var(--bad)}
.score{border:2px solid var(--accent);border-radius:var(--r);padding:1.2rem;background:var(--surface);display:grid;gap:.8rem;margin-top:1rem}
.score .big{font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score p{margin:0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.pager{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:2.4rem;max-width:66ch;font-family:var(--font-ui)}
.pager button{max-width:48%}

@media (max-width:860px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .lessons{grid-template-columns:minmax(0,1fr)}
  .lesson-grid{grid-template-columns:minmax(0,1fr);gap:0}
  .toc{display:none}
  .foot{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){
  .prose{font-size:1.04rem}
  .topbar .logo{display:none}
  .pager button{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

__RIBBON__
<div id="app"></div>

<script>
const LESSONS = __DATA__;
const SITE = "https://www.diversityxventures.com";
const ACCOUNT = __ACCOUNT__;
const LEGACY_KEY = "dxv-angel-foundations-v1";
const KEY = LEGACY_KEY + ":" + ACCOUNT.id;

/* ---------- progress: saved to the learner's DXV account, with this browser as the offline copy ----------
   Each lesson is marked "dirty" when it changes here and cleared once the server has it. On load,
   a dirty lesson (changed here but not yet saved) wins; otherwise the server's copy wins. */
function load(){
  try{
    const mine = localStorage.getItem(KEY);
    if (mine) return JSON.parse(mine) || {};
    // First visit signed in: bring over progress made on this browser before accounts existed.
    const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null");
    if (legacy){ legacy.dirty = {1:1,2:1,3:1,4:1,5:1,6:1}; return legacy; }
  }catch(e){}
  return {};
}
let state = Object.assign({quiz:{}, notes:{}, opened:{}, dirty:{}}, load());
state.dirty = state.dirty || {};
function store(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let syncTimer = null, syncing = false;
function lessonPayload(n){
  const notes = {};
  for (const [k,v] of Object.entries(state.notes)) if (k.startsWith(`note-${n}-`)) notes[k] = v;
  return { opened: !!state.opened[n], answers: (state.quiz[n]||{}).answers || {}, notes };
}
function save(n){
  if (n) state.dirty[n] = (state.dirty[n]||0) + 1;
  store();
  clearTimeout(syncTimer); syncTimer = setTimeout(push, 800);
}
function saveAll(){ for (const L of LESSONS) state.dirty[L.n] = (state.dirty[L.n]||0) + 1; save(); }
async function push(){
  if (syncing) { clearTimeout(syncTimer); syncTimer = setTimeout(push, 800); return; }
  const sent = {}; const lessons = {};
  for (const [n,v] of Object.entries(state.dirty)) if (v) { sent[n] = v; lessons[n] = lessonPayload(+n); }
  if (!Object.keys(lessons).length) return;
  syncing = true; setSyncNote("Saving");
  try{
    const r = await fetch("/api/learn/progress", {method:"PUT", headers:{"content-type":"application/json"}, body: JSON.stringify({lessons}), credentials:"same-origin"});
    if (r.status === 401) { setSyncNote("Signed out: saved in this browser only. Sign in again to save to your account."); return; }
    const out = r.ok && (r.headers.get("content-type")||"").includes("json") ? await r.json() : null;
    if (!out || !out.ok) throw new Error("save");
    for (const [n,v] of Object.entries(sent)) if (state.dirty[n] === v) delete state.dirty[n];
    store(); setSyncNote("Saved to your account");
  }catch(e){ setSyncNote("Offline: saved in this browser. We'll save to your account when you're back online."); }
  finally{ syncing = false; }
}
async function pull(){
  try{
    const r = await fetch("/api/learn/progress", {credentials:"same-origin", cache:"no-store"});
    if (!r.ok || !(r.headers.get("content-type")||"").includes("json")) return;
    const {lessons} = await r.json();
    for (const L of LESSONS){
      if (state.dirty[L.n]) continue; // changed here and not saved yet: this browser's copy wins
      const s = lessons[L.n];
      for (const k of Object.keys(state.notes)) if (k.startsWith(`note-${L.n}-`)) delete state.notes[k];
      if (!s) { delete state.opened[L.n]; delete state.quiz[L.n]; continue; }
      if (s.opened) state.opened[L.n] = true; else delete state.opened[L.n];
      state.quiz[L.n] = {answers: s.answers || {}};
      Object.assign(state.notes, s.notes || {});
    }
    store();
    if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") { const y = window.scrollY; route(); window.scrollTo(0, y); }
    push();
  }catch(e){}
}
function setSyncNote(t){ const el = document.getElementById("syncNote"); if (el) el.textContent = t; }
window.addEventListener("online", push);

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words = L => L.blocks.map(b => (b.text||b.html||(b.rows||[]).flat().join(" ")).replace(/<[^>]+>/g," ")).join(" ").split(/\s+/).filter(Boolean).length;
const mins = L => Math.max(3, Math.round(words(L)/220));
function quizState(n){ return state.quiz[n] || (state.quiz[n] = {answers:{}}); }
function answered(n){ return Object.keys((state.quiz[n]||{}).answers||{}).length; }
function correct(n){ const L=LESSONS[n-1], a=(state.quiz[n]||{}).answers||{}; return L.quiz.filter((q,i)=>a[i]===q.answer).length; }
function status(n){
  const L=LESSONS[n-1];
  if (answered(n) >= L.quiz.length) return {k:"done", label:`Complete · ${correct(n)}/${L.quiz.length}`};
  if (state.opened[n] || answered(n)) return {k:"prog", label:"In progress"};
  return {k:"", label:"Not started"};
}
const doneCount = () => LESSONS.filter(L => status(L.n).k==="done").length;

/* ---------- routing ---------- */
function route(){
  const m = location.hash.match(/^#lesson-([1-6])$/);
  if (m) renderLesson(+m[1]); else renderHome();
}
function go(hash){
  if (location.hash === hash) route(); else location.hash = hash;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });

/* ---------- home ---------- */
function renderHome(){
  document.title = "Angel Investing Foundations";
  const done = doneCount();
  const next = LESSONS.find(L => status(L.n).k!=="done") || LESSONS[0];
  const ticks = LESSONS.map(L => { const s=status(L.n).k; return `<span class="${s==="done"?"on":s==="prog"?"half":""}"></span>`; }).join("");
  const totalQ = LESSONS.reduce((t,L)=>t+L.quiz.length,0);
  const totalRight = LESSONS.reduce((t,L)=>t+correct(L.n),0);
  document.getElementById("app").innerHTML = `
  <header class="hero"><div class="wrap">
    <div class="hero-top"><span class="logo" role="img" aria-label="Diversity X Ventures"></span>
    <span class="who">${ACCOUNT.ribbon ? `<a href="/learn/account">Your learning account</a>` : `Signed in as ${esc(ACCOUNT.name)} <span aria-hidden="true">·</span> <a href="/learn/account">Your account</a>`}</span></div>
    <div class="hero-grid">
      <div>
        <span class="eyebrow">Angel investing course · 6 lessons</span>
        <h1>Angel Investing Foundations</h1>
        <p class="lede">Learn how to build an investment thesis, find and screen startups, carry out due diligence, use EIS and SEIS, build a portfolio and support the companies you back.</p>
      </div>
      <div class="meter" aria-label="Your progress">
        <div class="meter-top"><span>Lessons complete</span><strong>${done}<span style="font-size:1rem;color:var(--band-soft)"> / 6</span></strong></div>
        <div class="ticks">${ticks}</div>
        <div><button class="btn btn-primary" id="startBtn">${done===6?"Review lesson 1":(state.opened[next.n]||answered(next.n)?"Continue":"Start")} lesson ${done===6?1:next.n} <span aria-hidden="true">→</span></button></div>
      </div>
    </div>
  </div></header>
  <main class="wrap">
    <div class="section-head"><h2>Lessons</h2><p>Each lesson ends with a five-question quiz. Your progress is saved to your account, so it follows you across devices. <span id="syncNote" aria-live="polite"></span></p></div>
    <ol class="lessons">
      ${LESSONS.map(L => { const s=status(L.n); return `<li><button class="lesson-card" data-n="${L.n}">
        <span class="num">${L.n}</span>
        <span><span class="ct">${esc(L.short)}</span><span class="sub">${esc(L.title.toLowerCase()!==L.short.toLowerCase() ? L.title : ((L.blocks.find(b=>b.t==="h1")||{}).text||L.title))}</span>
        <span class="meta"><span>${mins(L)} min read</span><span aria-hidden="true">·</span><span>${L.quiz.length} questions</span>
        <span class="chip ${s.k}"><span class="dot"></span>${s.label}</span></span></span>
      </button></li>`; }).join("")}
    </ol>
    ${done===6 ? `<section class="finish"><span class="eyebrow" style="color:var(--plum)">Course complete</span>
      <h2>You have finished all six lessons</h2>
      <p>You answered ${totalRight} of ${totalQ} quiz questions correctly. You can revisit any lesson or retake a quiz at any time.</p>
      <div class="actions"><a class="btn btn-primary" href="${SITE}" target="_blank" rel="noopener">Visit Diversity X Ventures</a><button class="btn btn-ghost" id="resetBtn">Reset my progress</button></div>
      <p id="resetConfirm" hidden></p></section>` : ""}
  </main>
  ${footer()}`;
  document.getElementById("startBtn").onclick = () => go(`#lesson-${done===6?1:next.n}`);
  document.querySelectorAll(".lesson-card").forEach(b => b.onclick = () => go(`#lesson-${b.dataset.n}`));
  const r = document.getElementById("resetBtn");
  if (r) r.onclick = () => {
    if (r.dataset.armed){ state={quiz:{},notes:{},opened:{},dirty:{}}; saveAll(); renderHome(); return; }
    r.dataset.armed="1"; r.textContent="Click again to clear quizzes and notes";
  };
}
function footer(){
  return `<footer><div class="wrap foot">
    <div><span class="logo" role="img" aria-label="Diversity X Ventures"></span>
    <p>This course is for education only. It is not investment, tax or legal advice. Investing in early-stage companies is high risk: you could lose all the money you invest, and you may not be able to sell your shares. Tax treatment depends on individual circumstances and may change.</p></div>
    <span class="foot-links"><a href="/learn/account">Your account</a><a href="/learn/privacy">Course privacy notice</a><a href="${SITE}" target="_blank" rel="noopener">diversityxventures.com</a></span>
  </div></footer>`;
}

/* ---------- lesson ---------- */
let scrollHandler = null;
function renderLesson(n){
  const L = LESSONS[n-1];
  if (!state.opened[n]) { state.opened[n] = true; save(n); }
  document.title = `Lesson ${n}: ${L.short} · Angel Investing Foundations`;
  let hid = 0; const toc = [];
  const body = L.blocks.map((b, bi) => {
    if (b.t==="h1"||b.t==="h2"||b.t==="h3"){
      const id = `s${n}-${hid++}`; const tag = b.t==="h1"?"h2":b.t==="h2"?"h3":"h4";
      if (b.t!=="h3") toc.push({id, text:b.text, lvl:b.t});
      return `<${tag} id="${id}" class="${b.t}">${esc(b.text)}</${tag}>`;
    }
    if (b.t==="p") return `<p>${b.html}</p>`;
    if (b.t==="list") return b.html;
    if (b.t==="table"){
      const [head, ...rows] = b.rows;
      if (b.notes){
        return `<div class="notes"><div class="notes-head"><strong>${head.map(esc).join(" · ")}</strong><span>Saved to your account. Only you can see your notes.</span></div>
          ${rows.map((r,ri)=>{ const id=`note-${n}-${bi}-${ri}`; return `<div class="note-row"><label for="${id}">${r[0]}</label><span class="prompt">${r[1]||""}</span><textarea id="${id}" data-key="${id}" placeholder="Your answer">${esc(state.notes[id]||"")}</textarea></div>`; }).join("")}
        </div>`;
      }
      return `<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    return "";
  }).join("");
  const prev = n>1 ? LESSONS[n-2] : null, next = n<6 ? LESSONS[n] : null;
  document.getElementById("app").innerHTML = `
  <div class="topbar"><div class="wrap">
    <button class="back" id="backBtn"><span aria-hidden="true">←</span> All lessons</button>
    <span class="logo" role="img" aria-label="Diversity X Ventures"></span>
    <span style="font-size:.85rem;font-variant-numeric:tabular-nums">Lesson ${n} of 6</span>
  </div><div class="readbar"><i id="readbar"></i></div></div>
  <main class="wrap" style="padding-top:0">
    <div class="lesson-head"><span class="eyebrow">Lesson ${n} · ${mins(L)} min read</span><h1>${esc(L.title)}</h1></div>
    <div class="lesson-grid">
      <nav class="toc" aria-label="In this lesson"><span class="eyebrow">In this lesson</span><ol>
        ${toc.map(t=>`<li><button data-to="${t.id}" class="${t.lvl==="h2"?"lvl2":""}">${esc(t.text)}</button></li>`).join("")}
        <li><button data-to="quiz-${n}" class="quizlink">Quiz · ${L.quiz.length} questions</button></li>
      </ol></nav>
      <div>
        <article class="prose">${body}</article>
        <section class="quiz" id="quiz-${n}" aria-labelledby="quiz-title-${n}">
          <div class="quiz-head"><span class="eyebrow">Check your understanding</span><h2 id="quiz-title-${n}">Lesson ${n} quiz</h2>
          <p>Choose one answer for each question. You will see the correct answer straight away.</p></div>
          <div id="qlist"></div>
          <div id="qscore" aria-live="polite"></div>
        </section>
        <div class="pager">
          ${prev?`<button class="btn btn-ghost" data-go="${prev.n}"><span aria-hidden="true">←</span> Lesson ${prev.n}: ${esc(prev.short)}</button>`:`<span></span>`}
          ${next?`<button class="btn btn-ghost" data-go="${next.n}">Lesson ${next.n}: ${esc(next.short)} <span aria-hidden="true">→</span></button>`:`<button class="btn btn-ghost" data-home="1">Back to all lessons</button>`}
        </div>
      </div>
    </div>
  </main>
  ${footer()}`;
  document.getElementById("backBtn").onclick = () => go("#course");
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(`#lesson-${b.dataset.go}`));
  document.querySelectorAll("[data-home]").forEach(b => b.onclick = () => go("#course"));
  document.querySelectorAll(".toc button").forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.to); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto":"smooth", block:"start"});
  });
  document.querySelectorAll("textarea[data-key]").forEach(t => t.addEventListener("input", () => { state.notes[t.dataset.key] = t.value; save(n); }));
  renderQuiz(n);
  // reading progress + active contents item
  if (scrollHandler) window.removeEventListener("scroll", scrollHandler);
  const bar = document.getElementById("readbar");
  const heads = [...document.querySelectorAll(".prose h2[id], .prose h3[id]"), document.getElementById(`quiz-${n}`)];
  const tocBtns = [...document.querySelectorAll(".toc button")];
  scrollHandler = () => {
    const h = document.documentElement; const max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max>0 ? Math.min(100, h.scrollTop/max*100) : 0) + "%";
    let cur = null; for (const el of heads){ if (el && el.getBoundingClientRect().top < 140) cur = el.id; }
    tocBtns.forEach(b => b.classList.toggle("active", b.dataset.to===cur));
  };
  window.addEventListener("scroll", scrollHandler, {passive:true}); scrollHandler();
}

function renderQuiz(n){
  const L = LESSONS[n-1], qs = quizState(n);
  document.getElementById("qlist").innerHTML = L.quiz.map((q,i) => {
    const pick = qs.answers[i];
    const opts = q.options.map(o => {
      let cls = "", mark = "";
      if (pick){ if (o.k===q.answer){cls="right";mark="Correct";} else if (o.k===pick){cls="wrong";mark="Your answer";} }
      return `<button class="opt ${cls}" data-q="${i}" data-k="${o.k}" ${pick?"disabled":""} aria-pressed="${pick===o.k}"><span class="k">${o.k}</span><span>${esc(o.text)}</span><span class="mark">${mark}</span></button>`;
    }).join("");
    let fb = "";
    if (pick){
      const ok = pick===q.answer;
      fb = `<div class="feedback ${ok?"ok":"no"}" role="status"><strong>${ok?"Correct":"Not quite"} · the answer is ${q.answer}</strong>${q.explanation?esc(q.explanation):""}</div>`;
    }
    return `<div class="qcard"><h3><b>${i+1}.</b><span>${esc(q.q)}</span></h3><div class="opts">${opts}</div>${fb}</div>`;
  }).join("");
  document.querySelectorAll(".opt[data-q]").forEach(b => b.onclick = () => {
    const i = +b.dataset.q; if (qs.answers[i]) return;
    qs.answers[i] = b.dataset.k; save(n);
    const y = window.scrollY; renderQuiz(n); window.scrollTo(0, y);
  });
  const total = L.quiz.length, got = correct(n), done = answered(n) >= total;
  const next = n<6 ? LESSONS[n] : null;
  document.getElementById("qscore").innerHTML = done ? `<div class="score">
      <span class="eyebrow" style="color:var(--plum)">Lesson ${n} complete</span>
      <span class="big">${got} / ${total}</span>
      <p>${got===total ? "You answered every question correctly." : got>=3 ? "A solid result. Review the answers above, then move on when you are ready." : "Worth another look. Reread the lesson sections above and try the quiz again."}</p>
      <div class="actions">
        ${next?`<button class="btn btn-primary" id="nextBtn">Next: ${esc(next.short)} <span aria-hidden="true">→</span></button>`:`<button class="btn btn-primary" id="nextBtn">See your course summary</button>`}
        <button class="btn btn-ghost" id="retryBtn">Retake quiz</button>
      </div></div>` : `<p style="color:var(--muted);margin:.6rem 0 0">${answered(n)} of ${total} answered</p>`;
  if (done){
    document.getElementById("nextBtn").onclick = () => go(next ? `#lesson-${next.n}` : "#course");
    document.getElementById("retryBtn").onclick = () => { state.quiz[n] = {answers:{}}; save(n); renderQuiz(n); document.getElementById(`quiz-${n}`).scrollIntoView({block:"start"}); };
  }
}

route();
pull();
</script>
