<style>
/* Layout: a brand-green course band over a calm reading surface; lessons read in one 66ch column with a sticky contents rail on wide screens. */
:root{

}

  --good:#7fd6a3; --good-bg:#16392b; --bad:#ff9b8f; --bad-bg:#3a1c1a; --plum:#d3b1e2; --chip:#1b3631; color-scheme:dark}}
:root[data-theme="dark"]{

.hero .lede{font-family:var(--font-read);font-size:1.15rem;line-height:1.55;max-width:46ch;margin:1rem 0 0;color:var(--band-soft)}
.meter{background:rgba(0,0,0,.18);border:1px solid rgba(251,228,91,.35);border-radius:var(--r);padding:1.1rem 1.2rem;display:grid;gap:.7rem}

main{padding-block:2.2rem 3rem}

/* footer */

.where{font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}

.lesson-main{padding-top:2rem}

.stage{min-width:0;max-width:760px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(1.4rem,4vw,2.6rem) clamp(1.2rem,4.5vw,3rem);min-height:min(56vh,520px);box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(21,48,42,.35)}

.slide-h{font-family:var(--font-ui);font-size:clamp(1.45rem,3.4vw,2rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 1.1rem;display:flex;gap:.8rem;align-items:flex-start}

.cont{font-family:var(--font-ui);font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:-.6rem 0 1rem!important}
.prose{font-family:var(--font-read);font-size:1.12rem;line-height:1.68;min-width:0}
.prose.roomy{font-size:1.22rem}
.prose p{margin:0 0 1em}
.prose > .slide-h + p:not(.minihead):not(.cont),.prose > .eyebrow + p:not(.minihead){font-size:1.08em;color:var(--ink)}

.prose ul,.prose ol{margin:0 0 1.2em;padding:0;list-style:none;display:grid;gap:.5rem}

.prose li ul,.prose li ol{margin:.5rem 0 0}
.prose strong{font-weight:600}
.prose a{color:var(--plum);text-underline-offset:3px}

.table-wrap table{border-collapse:collapse;width:100%;font-family:var(--font-ui);font-size:.92rem;line-height:1.45;min-width:520px}

.notes-head{background:var(--band);color:var(--band-ink);padding:.75rem 1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:baseline}

/* the title screen */
.slide-title{display:grid;align-content:center;gap:1rem;background:var(--band);color:var(--band-soft);border-color:var(--band);border-bottom:6px solid var(--accent)}

.facts span{background:rgba(255,255,255,.1);border-radius:999px;padding:.25rem .7rem;font-size:.85rem}
.covers ol{margin:.4rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem;font-family:var(--font-read);font-size:1.05rem}

/* quiz and score */
.slide-quiz,.slide-score{font-family:var(--font-ui)}

.feedback{margin-top:1rem;font-size:.98rem;padding:.8rem 1rem;border-radius:10px;background:var(--chip)}

.feedback.ok strong{color:var(--good)}

.slide-score{display:grid;align-content:center;justify-items:start;gap:1rem;border:2px solid var(--accent)}
.slide-score .big{font-size:clamp(3rem,9vw,4.5rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--plum)}
.slide-score .lead{margin:0;color:var(--muted);font-size:1.08rem;max-width:46ch}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
/* the bar under each screen */
.slide-nav{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1.1rem;font-family:var(--font-ui)}
.slide-nav .btn[disabled]{opacity:.45;cursor:not-allowed}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:50%}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.past{background:var(--plum);opacity:.45}
.dots i.on{background:var(--plum);width:22px;border-radius:999px}
.dots i.q{border-radius:2px}
.dots i.q.on{border-radius:999px}
/* moving between screens */
@keyframes in-fwd{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes in-bwd{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.slide-anim.fwd{animation:in-fwd .28s ease-out}
.slide-anim.bwd{animation:in-bwd .28s ease-out}

@media (max-width:860px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .lessons{grid-template-columns:minmax(0,1fr)}
  .lesson-grid{grid-template-columns:minmax(0,1fr);gap:0}
  .toc{display:none}
  .m-outline{display:block}
  .stage{max-width:none}
  .foot{grid-template-columns:minmax(0,1fr)}
  .lesson-main{padding-top:1rem}
  /* Phones and tablets: Back / Next stay within thumb reach. */
  .slide-nav{position:sticky;bottom:0;z-index:15;background:var(--bg);padding:.7rem 0 calc(.7rem + env(safe-area-inset-bottom,0px));margin-top:.6rem;border-top:1px solid var(--line)}
  .slide{min-height:0}
}
@media (max-width:480px){
  .prose{font-size:1.05rem}
  .prose.roomy{font-size:1.12rem}
  .topbar .logo{display:none}
  .slide{border-radius:12px}
  .slide-nav .btn{padding:.65rem .95rem}
  .dots{display:none}
  .prose ul > li,.prose ol > li{padding-left:1.9rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.slide-anim{animation:none!important}}
</style>

<div id="app"></div>

<script>
const LESSONS = __DATA__;
const SITE = "https://www.diversityxventures.com";
const ACCOUNT = __ACCOUNT__;
const LEGACY_KEY = "dxv-angel-foundations-v1";
const KEY = LEGACY_KEY + ":" + ACCOUNT.id;

/* ---------- progress: saved to the learner's DXV account, with this browser as the offline copy ----------
   Each lesson is marked "dirty" when it changes here and cleared once the server has it. On load,
   a dirty lesson (changed here but not yet saved) wins; otherwise the server's copy wins. */
function load(){
  try{
    const mine = localStorage.getItem(KEY);
    if (mine) return JSON.parse(mine) || {};
    // First visit signed in: bring over progress made on this browser before accounts existed.
    const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null");
    if (legacy){ legacy.dirty = {1:1,2:1,3:1,4:1,5:1,6:1}; return legacy; }
  }catch(e){}
  return {};
}
let state = Object.assign({quiz:{}, notes:{}, opened:{}, dirty:{}}, load());
state.dirty = state.dirty || {};
function store(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let syncTimer = null, syncing = false;
function lessonPayload(n){
  const notes = {};
  for (const [k,v] of Object.entries(state.notes)) if (k.startsWith(`note-${n}-`)) notes[k] = v;
  return { opened: !!state.opened[n], answers: (state.quiz[n]||{}).answers || {}, notes };
}
function save(n){
  if (n) state.dirty[n] = (state.dirty[n]||0) + 1;
  store();
  clearTimeout(syncTimer); syncTimer = setTimeout(push, 800);
}
function saveAll(){ for (const L of LESSONS) state.dirty[L.n] = (state.dirty[L.n]||0) + 1; save(); }
async function push(){
  if (syncing) { clearTimeout(syncTimer); syncTimer = setTimeout(push, 800); return; }
  const sent = {}; const lessons = {};
  for (const [n,v] of Object.entries(state.dirty)) if (v) { sent[n] = v; lessons[n] = lessonPayload(+n); }
  if (!Object.keys(lessons).length) return;
  syncing = true; setSyncNote("Saving");
  try{
    const r = await fetch("/api/learn/progress", {method:"PUT", headers:{"content-type":"application/json"}, body: JSON.stringify({lessons}), credentials:"same-origin"});
    if (r.status === 401) { setSyncNote("Signed out: saved in this browser only. Sign in again to save to your account."); return; }
    const out = r.ok && (r.headers.get("content-type")||"").includes("json") ? await r.json() : null;
    if (!out || !out.ok) throw new Error("save");
    for (const [n,v] of Object.entries(sent)) if (state.dirty[n] === v) delete state.dirty[n];
    store(); setSyncNote("Saved to your account");
  }catch(e){ setSyncNote("Offline: saved in this browser. We'll save to your account when you're back online."); }
  finally{ syncing = false; }
}
async function pull(){
  try{
    const r = await fetch("/api/learn/progress", {credentials:"same-origin", cache:"no-store"});
    if (!r.ok || !(r.headers.get("content-type")||"").includes("json")) return;
    const {lessons} = await r.json();
    for (const L of LESSONS){
      if (state.dirty[L.n]) continue; // changed here and not saved yet: this browser's copy wins
      const s = lessons[L.n];
      for (const k of Object.keys(state.notes)) if (k.startsWith(`note-${L.n}-`)) delete state.notes[k];
      if (!s) { delete state.opened[L.n]; delete state.quiz[L.n]; continue; }
      if (s.opened) state.opened[L.n] = true; else delete state.opened[L.n];
      state.quiz[L.n] = {answers: s.answers || {}};
      Object.assign(state.notes, s.notes || {});
    }
    store();
    if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") { const y = window.scrollY; route(); window.scrollTo(0, y); }
    push();
  }catch(e){}
}
function setSyncNote(t){ const el = document.getElementById("syncNote"); if (el) el.textContent = t; }
window.addEventListener("online", push);

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words = L => L.blocks.map(b => (b.text||b.html||(b.rows||[]).flat().join(" ")).replace(/<[^>]+>/g," ")).join(" ").split(/\s+/).filter(Boolean).length;
const mins = L => Math.max(3, Math.round(words(L)/220));
function quizState(n){ return state.quiz[n] || (state.quiz[n] = {answers:{}}); }
function answered(n){ return Object.keys((state.quiz[n]||{}).answers||{}).length; }
function correct(n){ const L=LESSONS[n-1], a=(state.quiz[n]||{}).answers||{}; return L.quiz.filter((q,i)=>a[i]===q.answer).length; }
function status(n){
  const L=LESSONS[n-1];
  if (answered(n) >= L.quiz.length) return {k:"done", label:`Complete · ${correct(n)}/${L.quiz.length}`};
  if (state.opened[n] || answered(n)) return {k:"prog", label:"In progress"};
  return {k:"", label:"Not started"};
}
const doneCount = () => LESSONS.filter(L => status(L.n).k==="done").length;

/* ---------- routing ---------- */
// #lesson-3 opens lesson 3 where the learner left off; #lesson-3/5 is its fifth screen.
let lastPlace = null;
function route(){
  const m = location.hash.match(/^#lesson-([1-6])(?:\/(\d+))?$/);
  if (m) renderLesson(+m[1], m[2] ? +m[2] - 1 : null); else { lastPlace = null; renderHome(); }
}
function go(hash){
  if (location.hash === hash) route(); else location.hash = hash;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });

/* ---------- home ---------- */
function renderHome(){
  document.title = "Angel Investing Foundations";
  const done = doneCount();
  const next = LESSONS.find(L => status(L.n).k!=="done") || LESSONS[0];
  const ticks = LESSONS.map(L => { const s=status(L.n).k; return `<span class="${s==="done"?"on":s==="prog"?"half":""}"></span>`; }).join("");
  const totalQ = LESSONS.reduce((t,L)=>t+L.quiz.length,0);
  const totalRight = LESSONS.reduce((t,L)=>t+correct(L.n),0);
  document.getElementById("app").innerHTML = `
  <header class="hero"><div class="wrap">
    <div class="hero-top"><span class="logo" role="img" aria-label="Diversity X Ventures"></span>
    <span class="who">${ACCOUNT.ribbon ? `<a href="/learn/account">Your learning account</a>` : `Signed in as ${esc(ACCOUNT.name)} <span aria-hidden="true">·</span> <a href="/learn/account">Your account</a>`}</span></div>
    <div class="hero-grid">
      <div>
        <span class="eyebrow">Angel investing course · 6 lessons</span>
        <h1>Angel Investing Foundations</h1>
        <p class="lede">Learn how to build an investment thesis, find and screen startups, carry out due diligence, use EIS and SEIS, build a portfolio and support the companies you back.</p>
      </div>
      <div class="meter" aria-label="Your progress">
        <div class="meter-top"><span>Lessons complete</span><strong>${done}<span style="font-size:1rem;color:var(--band-soft)"> / 6</span></strong></div>
        <div class="ticks">${ticks}</div>
        <div><button class="btn btn-primary" id="startBtn">${done===6?"Review lesson 1":(state.opened[next.n]||answered(next.n)?"Continue":"Start")} lesson ${done===6?1:next.n} <span aria-hidden="true">→</span></button></div>
      </div>
    </div>
  </div></header>
  <main class="wrap">
    <div class="section-head"><h2>Lessons</h2><p>Each lesson ends with a five-question quiz. Your progress is saved to your account, so it follows you across devices. <span id="syncNote" aria-live="polite"></span></p></div>
    <ol class="lessons">
      ${LESSONS.map(L => { const s=status(L.n); return `<li><button class="lesson-card" data-n="${L.n}">
        <span class="num">${L.n}</span>
        <span><span class="ct">${esc(L.short)}</span><span class="sub">${esc(L.title.toLowerCase()!==L.short.toLowerCase() ? L.title : ((L.blocks.find(b=>b.t==="h1")||{}).text||L.title))}</span>
        <span class="meta"><span>${mins(L)} min read</span><span aria-hidden="true">·</span><span>${L.quiz.length} questions</span>
        <span class="chip ${s.k}"><span class="dot"></span>${s.label}</span></span></span>
      </button></li>`; }).join("")}
    </ol>
    ${done===6 ? `<section class="finish"><span class="eyebrow" style="color:var(--plum)">Course complete</span>
      <h2>You have finished all six lessons</h2>
      <p>You answered ${totalRight} of ${totalQ} quiz questions correctly. You can revisit any lesson or retake a quiz at any time.</p>
      <div class="actions"><a class="btn btn-primary" href="${SITE}" target="_blank" rel="noopener">Visit Diversity X Ventures</a><button class="btn btn-ghost" id="resetBtn">Reset my progress</button></div>
      <p id="resetConfirm" hidden></p></section>` : ""}
  </main>
  ${footer()}`;
  document.getElementById("startBtn").onclick = () => go(`#lesson-${done===6?1:next.n}`);
  document.querySelectorAll(".lesson-card").forEach(b => b.onclick = () => go(`#lesson-${b.dataset.n}`));
  const r = document.getElementById("resetBtn");
  if (r) r.onclick = () => {
    if (r.dataset.armed){ state={quiz:{},notes:{},opened:{},dirty:{}}; saveAll(); renderHome(); return; }
    r.dataset.armed="1"; r.textContent="Click again to clear quizzes and notes";
  };
}
function footer(){
  return `<footer><div class="wrap foot">
    <div><span class="logo" role="img" aria-label="Diversity X Ventures"></span>
    <p>This course is for education only. It is not investment, tax or legal advice. Investing in early-stage companies is high risk: you could lose all the money you invest, and you may not be able to sell your shares. Tax treatment depends on individual circumstances and may change.</p></div>
    <span class="foot-links"><a href="/learn/account">Your account</a><a href="/learn/privacy">Course privacy notice</a><a href="${SITE}" target="_blank" rel="noopener">diversityxventures.com</a></span>
  </div></footer>`;
}

/* ---------- lesson ---------- */
/* ---------- lessons as screens ----------
   Each lesson is shown a screen at a time, like slides: a title screen, short content screens
   (a new screen at every heading; long sections split at paragraph breaks, about 150 words a
   screen, never between a lead-in and its list), one quiz question per screen, then the score.
   The lesson text itself is exactly as written: only the presentation changes. */
const TARGET = 150, MAX = 230, MIN_TAIL = 45;
const plain = h => String(h||"").replace(/<[^>]+>/g," ");
const wc = b => plain(b.text||b.html||(b.rows||[]).flat().join(" ")).split(/\s+/).filter(Boolean).length;
// A short paragraph with no full stop works as a sub-heading (e.g. "1. Legal Documents").
const miniHead = b => b.t==="p" && wc(b) <= 10 && !/[.?!:;,]\s*$/.test(plain(b.html).trim());
const leadsIn = b => b.t==="h3" || (b.t==="p" && (/:\s*$/.test(plain(b.html).trim()) || miniHead(b)));
const plan = {};
function screensFor(L){
  if (plan[L.n]) return plan[L.n];
  const sections = []; let h1 = null, cur = {h1:null, head:null, blocks:[]};
  L.blocks.forEach((b, bi) => {
    if (b.t==="h1"||b.t==="h2"){
      if (cur.blocks.length) sections.push(cur);
      if (b.t==="h1") h1 = b.text;
      cur = {h1: b.t==="h2" ? h1 : null, head: b.text, blocks: []};
    } else cur.blocks.push({b, bi});
  });
  if (cur.blocks.length) sections.push(cur);
  const screens = [{kind:"title"}];
  sections.forEach((sec, si) => {
    const parts = []; let chunk = [], w = 0;
    for (const x of sec.blocks){
      const bw = wc(x.b), last = chunk[chunk.length-1];
      const canBreak = chunk.length && !leadsIn(last.b);
      if (canBreak && (w + bw > MAX || w >= TARGET || ((miniHead(x.b) || x.b.t==="h3") && w >= 60))) { parts.push(chunk); chunk = []; w = 0; }
      chunk.push(x); w += bw;
    }
    if (chunk.length){
      const tail = chunk.reduce((t,x)=>t+wc(x.b),0);
      if (parts.length && tail < MIN_TAIL) parts[parts.length-1].push(...chunk); else parts.push(chunk);
    }
    parts.forEach((blocks, pi) => screens.push({kind:"content", section:si, h1:sec.h1, head:sec.head, part:pi+1, parts:parts.length, blocks}));
  });
  L.quiz.forEach((q, qi) => screens.push({kind:"quiz", qi}));
  screens.push({kind:"score"});
  return (plan[L.n] = {screens, sections});
}
const firstQuiz = P => P.screens.findIndex(x => x.kind==="quiz");

function renderBlock(n, x){
  const b = x.b, bi = x.bi;
  if (b.t==="h3") return `<h3 class="h3">${esc(b.text)}</h3>`;
  if (b.t==="p") return miniHead(b) ? `<p class="minihead">${b.html}</p>` : `<p>${b.html}</p>`;
  if (b.t==="list") return b.html;
  if (b.t==="table"){
    const [head, ...rows] = b.rows;
    if (b.notes){
      return `<div class="notes"><div class="notes-head"><strong>${head.map(esc).join(" · ")}</strong><span>Saved to your account. Only you can see your notes.</span></div>
        ${rows.map((r,ri)=>{ const id=`note-${n}-${bi}-${ri}`; return `<div class="note-row"><label for="${id}">${r[0]}</label><span class="prompt">${r[1]||""}</span><textarea id="${id}" data-key="${id}" placeholder="Your answer">${esc(state.notes[id]||"")}</textarea></div>`; }).join("")}
      </div>`;
    }
    return `<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return "";
}
// "3. Timing" shows as a number badge and "Timing" (the same words).
function headingHtml(text, tag){
  const m = String(text).match(/^(\d+)\.\s+(.*)$/);
  return m ? `<${tag} class="slide-h"><span class="badge" aria-hidden="true">${m[1]}</span><span><span class="sr">${m[1]}. </span>${esc(m[2])}</span></${tag}>` : `<${tag} class="slide-h">${esc(text)}</${tag}>`;
}

function renderLesson(n, wanted){
  const L = LESSONS[n-1], P = screensFor(L), S = P.screens, total = S.length;
  state.pos = state.pos || {};
  // No screen in the address: carry on where they left off (the score screen restarts at the title).
  let idx = wanted == null ? (state.pos[n] && state.pos[n] < total - 1 ? state.pos[n] : 0) : Math.min(Math.max(wanted, 0), total - 1);
  if (wanted == null && idx) { history.replaceState(null, "", `#lesson-${n}/${idx+1}`); }
  // Slide in from the side we're moving towards (not when the same screen is simply redrawn).
  const dir = !lastPlace || lastPlace.n !== n ? "fwd" : idx > lastPlace.idx ? "fwd" : idx < lastPlace.idx ? "bwd" : "";
  lastPlace = {n, idx};
  if (!state.opened[n]) { state.opened[n] = true; save(n); }
  state.pos[n] = idx; store();
  const scr = S[idx];
  document.title = `Lesson ${n}: ${L.short} · Angel Investing Foundations`;
  const at = i => `#lesson-${n}/${i+1}`;
  const contentCount = S.filter(x=>x.kind==="content").length;
  const qs = quizState(n);

  // The outline: each section's first screen, then the quiz.
  const outline = P.sections.map((sec, si) => {
    const first = S.findIndex(x => x.kind==="content" && x.section===si);
    const here = scr.kind==="content" && scr.section===si;
    return `<li><a href="${at(first)}" class="${sec.h1 ? "lvl2" : ""}${here ? " active" : ""}"${here ? ' aria-current="step"' : ""}>${esc(sec.head || "Introduction")}</a></li>`;
  }).join("") + `<li><a href="${at(firstQuiz(P))}" class="quizlink${scr.kind==="quiz"||scr.kind==="score" ? " active" : ""}">Quiz · ${L.quiz.length} questions</a></li>`;

  let body = "", nextLabel = "Next", nextOk = true, prevLabel = "Back";
  if (scr.kind === "title"){
    const resume = state.pos[n] > 0;
    const h1s = P.sections.filter(sec => !sec.h1);
    body = `<div class="slide slide-title">
      <span class="eyebrow">Lesson ${n} of 6</span>
      <h1>${esc(L.title)}</h1>
      <p class="facts"><span>${mins(L)} min read</span><span>${contentCount} short screens</span><span>${L.quiz.length} quiz questions</span></p>
      <div class="covers"><span class="eyebrow">In this lesson</span><ol>${h1s.map(sec => `<li>${esc(sec.head || "Introduction")}</li>`).join("")}<li>Quiz: check your understanding</li></ol></div>
      <p class="hint">Use Next and Back, your arrow keys, or swipe on a phone. We remember where you got to.</p>
    </div>`;
    nextLabel = "Start the lesson";
    prevLabel = "All lessons";
  } else if (scr.kind === "content"){
    const eyebrow = [scr.h1 || (scr.head ? null : "Introduction"), scr.parts > 1 ? `Part ${scr.part} of ${scr.parts}` : null].filter(Boolean).join(" · ") || `Lesson ${n}`;
    body = `<article class="slide prose ${scr.blocks.reduce((t,x)=>t+wc(x.b),0) < 90 ? "roomy" : ""}">
      <span class="eyebrow">${esc(eyebrow)}</span>
      ${scr.head ? headingHtml(scr.head, "h2") : ""}
      ${scr.part > 1 && scr.head ? `<p class="cont">continued</p>` : ""}
      ${scr.blocks.map(x => renderBlock(n, x)).join("")}
    </article>`;
    if (S[idx+1] && S[idx+1].kind === "quiz") nextLabel = "Start the quiz";
  } else if (scr.kind === "quiz"){
    const q = L.quiz[scr.qi], pick = qs.answers[scr.qi];
    const opts = q.options.map(o => {
      let cls = "", mark = "";
      if (pick){ if (o.k===q.answer){cls="right";mark="Correct";} else if (o.k===pick){cls="wrong";mark="Your answer";} }
      return `<button class="opt ${cls}" data-k="${o.k}" ${pick?"disabled":""} aria-pressed="${pick===o.k}"><span class="k">${o.k}</span><span>${esc(o.text)}</span><span class="mark">${mark}</span></button>`;
    }).join("");
    const fb = pick ? `<div class="feedback ${pick===q.answer?"ok":"no"}" role="status"><strong>${pick===q.answer?"Correct":"Not quite"} · the answer is ${q.answer}</strong>${q.explanation?esc(q.explanation):""}</div>` : "";
    body = `<section class="slide slide-quiz" aria-labelledby="qh">
      <span class="eyebrow">Check your understanding · Question ${scr.qi+1} of ${L.quiz.length}</span>
      <h2 id="qh" class="slide-h">${esc(q.q)}</h2>
      <div class="opts">${opts}</div>${fb}
      ${pick ? "" : `<p class="hint">Choose one answer. You'll see the correct answer straight away.</p>`}
    </section>`;
    nextOk = !!pick;
    nextLabel = scr.qi === L.quiz.length - 1 ? "See your score" : "Next question";
  } else {
    const got = correct(n), tot = L.quiz.length, done = answered(n) >= tot, next = n<6 ? LESSONS[n] : null;
    const missing = L.quiz.map((q,i)=>i).filter(i => !qs.answers[i]);
    body = `<section class="slide slide-score">
      <span class="eyebrow">${done ? `Lesson ${n} complete` : `Lesson ${n}`}</span>
      ${done ? `<span class="big">${got} / ${tot}</span>
      <p class="lead">${got===tot ? "You answered every question correctly." : got>=3 ? "A solid result. Review the answers, then move on when you are ready." : "Worth another look. Go back through the lesson and try the quiz again."}</p>`
      : `<h2 class="slide-h">${missing.length} question${missing.length===1?"":"s"} still to answer</h2>`}
      <div class="actions">
        ${done ? (next ? `<button class="btn btn-primary" data-goto="#lesson-${next.n}">Next lesson: ${esc(next.short)}</button>` : `<button class="btn btn-primary" data-goto="#course">See your course summary</button>`)
               : `<button class="btn btn-primary" data-goto="${at(firstQuiz(P) + missing[0])}">Answer the quiz</button>`}
        ${done ? `<button class="btn btn-ghost" id="retryBtn">Retake the quiz</button>` : ""}
        <button class="btn btn-ghost" data-goto="${at(1)}">Review the lesson</button>
      </div>
    </section>`;
    nextLabel = next ? `Lesson ${next.n}` : "All lessons";
  }

  const pct = Math.round(idx / (total - 1) * 100);
  document.getElementById("app").innerHTML = `
  <div class="topbar"><div class="wrap">
    <button class="back" id="backBtn"><span aria-hidden="true">←</span> All lessons</button>
    <span class="logo" role="img" aria-label="Diversity X Ventures"></span>
    <span class="where">Lesson ${n} of 6 <span aria-hidden="true">·</span> ${idx+1} / ${total}</span>
  </div><div class="readbar" role="progressbar" aria-label="Progress through this lesson" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>
  <main class="wrap lesson-main">
    <div class="lesson-grid">
      <nav class="toc" aria-label="In this lesson"><span class="eyebrow">${esc(L.short)}</span><ol>${outline}</ol></nav>
      <div class="stage">
        <details class="m-outline"><summary>Contents <span aria-hidden="true">·</span> ${esc(L.short)}</summary><ol>${outline}</ol></details>
        <div class="slide-anim ${dir}" id="slide">${body}</div>
        <div class="slide-nav">
          <button class="btn btn-ghost" id="prevBtn"><span aria-hidden="true">←</span> ${esc(prevLabel)}</button>
          <span class="dots" aria-hidden="true">${S.map((x,i)=>`<i class="${i===idx?"on":i<idx?"past":""}${x.kind==="quiz"?" q":""}"></i>`).join("")}</span>
          <button class="btn btn-primary" id="nextBtn" ${nextOk?"":"disabled"}>${esc(nextLabel)} <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </div>
  </main>
  ${footer()}`;

  const prev = () => idx > 0 ? go(at(idx-1)) : go("#course");
  const nextL = n<6 ? LESSONS[n] : null;
  const fwd = () => { if (!nextOk) return; if (idx < total - 1) go(at(idx+1)); else go(nextL ? `#lesson-${nextL.n}` : "#course"); };
  document.getElementById("backBtn").onclick = () => go("#course");
  document.getElementById("prevBtn").onclick = prev;
  document.getElementById("nextBtn").onclick = fwd;
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => go(b.dataset.goto));
  const retry = document.getElementById("retryBtn");
  if (retry) retry.onclick = () => { state.quiz[n] = {answers:{}}; save(n); go(at(firstQuiz(P))); };
  document.querySelectorAll(".opt[data-k]").forEach(b => b.onclick = () => {
    if (qs.answers[scr.qi]) return;
    qs.answers[scr.qi] = b.dataset.k; save(n);
    renderLesson(n, idx);
    const nb = document.getElementById("nextBtn"); if (nb) nb.focus({preventScroll:true});
  });
  document.querySelectorAll("textarea[data-key]").forEach(t => t.addEventListener("input", () => { state.notes[t.dataset.key] = t.value; save(n); }));
  keyNav = e => {
    const tag = (e.target && e.target.tagName) || "";
    if (/TEXTAREA|INPUT|SELECT/.test(tag) || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); fwd(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  };
  swipeNav = {fwd, prev};
}

// Arrow keys and swipes move between screens (not while typing, or scrolling a table sideways).
let keyNav = null, swipeNav = null, touch = null;
document.addEventListener("keydown", e => { if (keyNav && /^#lesson-/.test(location.hash)) keyNav(e); });
document.addEventListener("touchstart", e => {
  const t = e.target;
  touch = (t.closest && (t.closest(".table-wrap") || t.closest("textarea"))) ? null : {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive:true});
document.addEventListener("touchend", e => {
  if (!touch || !swipeNav || !/^#lesson-/.test(location.hash)) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) (dx < 0 ? swipeNav.fwd : swipeNav.prev)();
}, {passive:true});

route();
pull();
</script>
